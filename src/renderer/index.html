<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'" />
  <title>Tia</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="assets/logo-light.png" alt="TiA" width="44" height="44" />
      <div>
        <div class="brand-name">Tia</div>
        <div class="brand-sub"><span id="business">Liepa Interjers</span> · <span id="today"></span></div>
      </div>
    </div>
    <div class="controls">
      <span class="mode" id="mode"></span>
      <button class="btn ghost" id="voiceBtn" title="Tia reads her updates out loud">Voice on</button>
      <button class="btn ghost" id="resetBtn" title="Forget what Tia learned and clear her log">Reset</button>
      <button class="btn ghost" id="replayBtn" title="Play the last saved run (no internet needed)">Replay</button>
      <button class="btn primary" id="runBtn">Start the day</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="Tia at work">
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="chips">
        <div class="chip-stat ok"><b id="statHandled">0</b> handled</div>
        <div class="chip-stat warn"><b id="statNeeds">0</b> need you</div>
        <div class="chip-stat"><b id="statMinutes">0</b> min saved</div>
      </div>
      <div class="status" id="progressLabel">Inbox waiting</div>
      <div class="caption" id="speech">Good morning. Press “Start the day” and I'll go through the inbox.</div>

      <div class="phone" id="phone" aria-label="Owner's phone">
        <div class="phone-notch"></div>
        <div class="phone-time" id="phoneTime">13:00</div>
        <div class="phone-date">Thursday 19 November</div>
        <div class="notes" id="notes"></div>
        <div class="phone-quiet" id="phoneQuiet">Handled work stays silent.</div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="needs" role="tab">Needs you <span class="count warn" id="countNeeds">0</span></button>
        <button class="tab" data-tab="handled" role="tab">Handled <span class="count ok" id="countHandled">0</span></button>
      </div>
      <div class="list" id="needs"></div>
      <div class="list" id="handled" hidden></div>
      <div class="rules">
        <strong>Phone rules</strong> · urgent buzzes now · the rest arrive as one summary · handled work never buzzes
      </div>
    </aside>
  </main>

  <template id="itemTpl">
    <article class="item">
      <button class="item-head" type="button">
        <span class="dot"></span>
        <span class="who"></span>
        <span class="when"></span>
        <span class="what"></span>
      </button>
      <div class="item-body">
        <div class="draft"><div class="label">My reply</div><div class="draft-text"></div></div>
        <ul class="actions"></ul>
        <div class="reason"></div>
        <div class="guard"></div>
        <div class="sources"></div>
      </div>
      <div class="buttons"></div>
    </article>
  </template>

  <script src="web-bridge.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
